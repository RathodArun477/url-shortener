<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink — Modern URL Shortener</title>
    <!-- Tailwind CSS CDN for instant, beautiful utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <main class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-100 text-blue-600 mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">URL Shortener</h1>
            <p class="text-sm text-slate-500">Paste your long link below to get a clean, shareable short URL.</p>
        </header>

        <!-- Input Form -->
        <div class="space-y-3">
            <div class="flex flex-col sm:flex-row gap-2">
                <input 
                    type="url" 
                    id="urlInput"
                    placeholder="https://example.com/very/long/path"
                    class="flex-1 px-4 py-3 rounded-xl border border-slate-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder:text-slate-400"
                    autofocus
                />
                <button 
                    id="shortenBtn"
                    onclick="shortenUrl()"
                    class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm transition-all shadow-sm hover:shadow active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
                >
                    Shorten
                </button>
            </div>

            <!-- Error Banner -->
            <div id="errorBanner" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="errorMessage">Something went wrong</span>
            </div>
        </div>

        <!-- Result Box (Hidden by default) -->
        <section id="resultCard" class="hidden rounded-xl border border-blue-100 bg-blue-50/50 p-5 space-y-4">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-blue-800 uppercase tracking-wider">Your Short Link</span>
                <span id="codeBadge" class="text-xs font-mono bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md font-semibold"></span>
            </div>

            <div class="flex items-center justify-between gap-2 bg-white border border-slate-200 rounded-lg p-2.5">
                <a id="shortUrlLink" href="#" target="_blank" class="font-mono text-sm font-semibold text-blue-600 truncate hover:underline">
                    <!-- URL text inserted dynamically -->
                </a>
                <div class="flex items-center gap-1 shrink-0">
                    <button 
                        id="copyBtn"
                        onclick="copyToClipboard()"
                        class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition-all active:scale-95"
                    >
                        Copy
                    </button>
                    <a 
                        id="visitBtn" 
                        href="#" 
                        target="_blank"
                        class="px-3 py-1.5 text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-all"
                    >
                        Open ↗
                    </a>
                </div>
            </div>

            <!-- Analytics Footer -->
            <div class="pt-3 border-t border-blue-100 flex items-center justify-between text-xs text-slate-600">
                <div class="flex items-center gap-1.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>Total Clicks: <strong id="clickCount" class="text-slate-900 font-bold">0</strong></span>
                </div>
                <button 
                    onclick="refreshStats()" 
                    class="text-blue-600 hover:text-blue-800 hover:underline flex items-center gap-1"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Refresh Clicks
                </button>
            </div>
        </section>

    </main>

    <!-- Vanilla JavaScript for API communication -->
    <script>
        let activeCode = "";

        // Trigger shorten on Enter key press
        document.getElementById("urlInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") shortenUrl();
        });

        async function shortenUrl() {
            const input = document.getElementById("urlInput");
            const btn = document.getElementById("shortenBtn");
            const errorBanner = document.getElementById("errorBanner");
            const errorMessage = document.getElementById("errorMessage");
            const resultCard = document.getElementById("resultCard");

            const rawUrl = input.value.trim();

            // Clear previous errors
            errorBanner.classList.add("hidden");

            if (!rawUrl) {
                showError("Please enter a URL first.");
                return;
            }

            // Disable button during network request
            btn.disabled = true;
            btn.innerText = "Shortening...";

            try {
                // Call your Flask POST /shorten endpoint
                const response = await fetch("/shorten", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: rawUrl })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || "Failed to shorten URL.");
                    return;
                }

                // Populate and display result card
                activeCode = data.code;
                document.getElementById("codeBadge").innerText = data.code;
                
                const linkElement = document.getElementById("shortUrlLink");
                linkElement.href = data.short_url;
                linkElement.innerText = data.short_url;

                document.getElementById("visitBtn").href = data.short_url;
                document.getElementById("clickCount").innerText = "0";

                resultCard.classList.remove("hidden");
                input.value = "";
            } catch (err) {
                showError("Network error. Please make sure the server is running.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Shorten";
            }
        }

        async function refreshStats() {
            if (!activeCode) return;
            try {
                const response = await fetch(`/stats/${activeCode}`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById("clickCount").innerText = data.clicks;
                }
            } catch (err) {
                console.error("Failed to refresh stats", err);
            }
        }

        async function copyToClipboard() {
            const shortUrl = document.getElementById("shortUrlLink").innerText;
            const copyBtn = document.getElementById("copyBtn");

            try {
                await navigator.clipboard.writeText(shortUrl);
                copyBtn.innerText = "Copied! ✓";
                copyBtn.classList.add("bg-emerald-100", "text-emerald-700");
                
                setTimeout(() => {
                    copyBtn.innerText = "Copy";
                    copyBtn.classList.remove("bg-emerald-100", "text-emerald-700");
                }, 1500);
            } catch (err) {
                prompt("Copy short link:", shortUrl);
            }
        }

        function showError(msg) {
            const errorBanner = document.getElementById("errorBanner");
            const errorMessage = document.getElementById("errorMessage");
            errorMessage.innerText = msg;
            errorBanner.classList.remove("hidden");
        }
    </script>
</body>
</html>
